site_name: Otixe · Agent Platform
site_description: Persistent agents, shared memory and human control — bilingual platform manual.
site_url: https://otixe.github.io/plataforma/
repo_url: https://github.com/otixe/plataforma
repo_name: otixe/plataforma
edit_uri: edit/main/docs/
strict: true
theme:
  name: material
  font: false
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: es
          name: Español
          build: true
          site_name: Otixe · Plataforma de agentes
          nav_translations:
            Overview: Visión general
            Architecture: Arquitectura
            Components: Componentes
            Working method: Método de trabajo
            Use cases & roadmap: Casos de uso y roadmap
            Sources & status: Fuentes y estado
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
extra_css:
  - stylesheets/extra.css
nav:
  - Overview: index.md
  - Architecture: architecture.md
  - Components:
      - Pi: pi.md
      - Oficinas: oficinas.md
      - Cerebro: cerebro.md
      - Sinapsis: sinapsis.md
      - AMA: ama.md
  - Working method: workflow.md
  - Use cases & roadmap: use-cases.md
  - Sources & status: sources.md
