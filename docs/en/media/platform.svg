<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 650" role="img" aria-labelledby="title desc">
<title id="title">Otixe platform: four components, shared state</title><desc id="desc">Pi runs agents; Oficinas coordinates persistent roles; Cerebro provides shared state; Sinapsis gives people a web interface. AMA connects runtime tool access to Cerebro.</desc>
